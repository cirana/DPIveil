name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build and test
        shell: powershell
        run: ./scripts/build.ps1

      - name: Require signing certificate for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Tagged releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD secrets."
          }

      - name: Sign DPIveil.exe
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: powershell
        run: |
          $Pfx = Join-Path $env:RUNNER_TEMP "dpiveil-signing.pfx"
          [IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $SignTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $SignTool) { throw "signtool.exe was not found." }
          & $SignTool.FullName sign /fd SHA256 /f $Pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 "dist\DPIveil.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          Remove-Item $Pfx -Force

      - name: Verify executable signature
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: powershell
        run: |
          $Signature = Get-AuthenticodeSignature "dist\DPIveil.exe"
          $Signature | Format-List
          if ($Signature.Status -ne "Valid") { throw "DPIveil.exe signature is not valid: $($Signature.Status)" }

      - name: Package three-file runtime
        shell: powershell
        run: |
          $Package = "DPIveil-windows-x64"
          New-Item -ItemType Directory -Force $Package | Out-Null
          Copy-Item "dist\DPIveil.exe" $Package
          Copy-Item "dist\WinDivert64.dll" $Package
          Copy-Item "dist\WinDivert64.sys" $Package
          Compress-Archive -Path "$Package\*" -DestinationPath "$Package.zip" -Force
          $Hash = (Get-FileHash "$Package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $Package.zip" | Set-Content "$Package.zip.sha256" -Encoding ascii

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPIveil-windows-x64
          path: |
            DPIveil-windows-x64.zip
            DPIveil-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "DPIveil-windows-x64.zip" "DPIveil-windows-x64.zip.sha256" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --generate-notes
